<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G Mart</title>
    <style>
        .Products {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
        }

        .card {
            display: flex;
            flex-direction: column;
            border: 2px solid black;
            width: fit-content;
            padding: 10px;
            align-items: center;
            justify-content: center;
            margin: 5px;
        }

        .card button {
            border-radius: 5px;
            border: 2px solid black;
            background-color: green;
            color: white;
            font-size: 10px;
            width: 140px;
            height: 40px;
        }

        #addItem {
            border-radius: 50%;
            border: 2px solid white;
            width: 30px;
            height: 30px;
             margin: 5px;
            padding: 5px;
        }

        #subItem {
            border-radius: 50%;
            border: 2px solid white;
            width: 30px;
            height: 30px;
            margin: 5px;
            padding: 5px;
        }

        table {
            width: 100%;
            align-items: center;
        }
        tr{
            background-color: lightgreen;
        }

        /* .disCart {
            width: 100%;
            display: flex;
            justify-content: space-evenly;
        }
        .cartHeaders {
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            flex-direction: column;
        } */
    </style>
</head>

<body>
    <h2>----Available Products----</h2>
    <div class="Products" id="Products">

    </div>
    <div class="cart">
        <h3>Cart Items</h3>
        <h6>__________________________</h6>
        <table class="cartHeaders">
            <thead style="width: 50%;">
                <tr>
                    <td> Title </td>
                    <td> Quantity </td>
                    <td> Price </td>
                </tr>
            </thead>
            <tbody id="cartHeaders">

            </tbody>

        </table>
        <h4 id="totalPrice"></h4>
    </div>
    <script>
        var cartItems = [];
        function genUI(products) {

            products.forEach(function (product) {
                var card = document.createElement("div");
                var btndiv = document.createElement("div");
                btndiv.style.display="flex";btndiv.style.alignItems="center";

                var btn = document.createElement("button");
                btn.innerText = "ADD CART"
                btndiv.id = product.id;
                btn.id = product.title;
                btn.addEventListener("click", function () {
                    addCart(product);
                })
                card.className = "card";
                card.innerHTML = `
                <img src="${product.thumbnail}">
                <h4>${product.title}-----$${product.price}</h4>
                `;
                btndiv.appendChild(btn);
                card.appendChild(btndiv)
                document.getElementById("Products").appendChild(card);
            })
        }
        function getdata() {
            fetch("https://dummyjson.com/products?limit=16&skip=15").then(response => response.json()).then(data => genUI(data.products));
        }
        getdata();
        function addCart(product) {
            let object = {
                title: "",
                count: 1,
                price: 0
            }
            object.title = product.title;
            object.price = product.price;
            document.getElementById(product.title).remove();
            var addItem = document.createElement("button");
            addItem.innerHTML = "+"
            addItem.id = "addItem"
            addItem.addEventListener("click", function () {
                for (let i = 0; i < cartItems.length; i++) {
                    if (cartItems[i].title == product.title) {
                        object.count++;
                        discount.innerText=object.count;
                        break
                    }
                    if (i == cartItems.length - 1) {
                        cartItems.push(object)
                    }
                }

                genCart(object.count);
                console.log(cartItems);
            });
            var discount = document.createElement("h4");
            discount.innerText=object.count;
            var subItem = document.createElement("button");
            subItem.innerHTML = "-";
            subItem.id = "subItem";
            subItem.addEventListener("click", function () {
                for (var i = 0; i < cartItems.length; i++) {
                    if (cartItems[i].title == product.title) {
                        object.count--;
                        discount.innerText=object.count;
                        if (object.count == 0) {
                            if (i == cartItems.length - 1) {
                                cartItems.pop()
                                break
                            }
                            console.log(cartItems[i]);
                            cartItems.splice(cartItems[i], 1);
                        }
                        break
                    }

                }

                genCart(object.count);
                console.log(cartItems);

            });
            cartItems.push(object);
            document.getElementById(product.id).appendChild(addItem)
            document.getElementById(product.id).appendChild(discount)
            document.getElementById(product.id).appendChild(subItem)
            console.log(cartItems);
            genCart(object.count);
        }
        function genCart(count) {
            document.getElementById("cartHeaders").innerHTML = ""
            cartItems.forEach(function (ele) {
                var dis = document.createElement("tr");
                dis.className = "disCart"
                var title = document.createElement("td");
                title.innerText = ele.title;
                var Quatity = document.createElement("td");
                Quatity.innerText = ele.count;
                var price = document.createElement("td");
                price.innerText = ele.price;
                dis.appendChild(title);
                dis.appendChild(Quatity);
                dis.appendChild(price);
                document.getElementById("cartHeaders").appendChild(dis);
            })
            var sum = 0;
            cartItems.forEach(function (ele) {
                sum += ele.count * ele.price
            })
            document.getElementById("totalPrice").innerText = "Total Price:" + sum;
        }

    </script>
</body>

</html>
